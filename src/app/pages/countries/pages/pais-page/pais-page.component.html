@if(country){
<div class="grid">
  <div class="col-12">
    <h2>
      País: <strong>{{ country.name.common }}</strong>
    </h2>
  </div>
</div>
<div class="grid">
  <div class="col-4">
    <h3>Bandera</h3>
    <img [src]="country.flags.svg" [alt]="country.name.common" width="100" />
  </div>
  <div class="col-8">
    <ul>
      <li><strong>Población:</strong> {{ country.population }}</li>
      <li><strong>Código:</strong> {{ country.cca3 }}</li>
    </ul>
  </div>
</div>
<div class="grid">
  <div class="col-12">
    <h3>Traducciones</h3>
    <div class="flex gap-2">
      <p-tag value="Primary" [value]="country.translations['jpn'].common" />
      <p-tag severity="success" [value]="country.translations['ara'].common" />
      <p-tag
        severity="secondary"
        [value]="country.translations['spa'].common"
      />
      <p-tag severity="info" [value]="country.translations['fra'].common" />
      <p-tag severity="warning" [value]="country.translations['ita'].common" />
    </div>
  </div>
</div>
}@else {
<p>Espere por favor</p>
}
