<h1>Mutaciones</h1>
<hr />
<div class="grid">
  <div class="col md:col-6 flex flex-column gap-1">
    <input type="text" pInputText [formControl]="email" placeholder="Email" />
    <input
      type="text"
      pInputText
      [formControl]="firstName"
      placeholder="First name"
    />
    <input
      type="text"
      pInputText
      [formControl]="lastName"
      placeholder="Last name"
    />
  </div>
  <div class="col md:col-6">
    <pre>{{ user() | json }}</pre>
    <p>{{ fullName() }}</p>
    <p>{{ counter() }}</p>
    <p-button (onClick)="updateCounter(1)" label="+ 1"></p-button>
  </div>
</div>
