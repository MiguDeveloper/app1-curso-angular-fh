<p-panel header="Pipes Personalizados" class="mb-2">
  <p>
    Angular allows you to create custom pipes. A custom pipe must implement the
    PipeTransform interface.
  </p>
</p-panel>
<div class="grid mt-2">
  <div class="col-12 md:col-4">
    <p-card header="UpperCase">
      {{ "nameLower" | toggleCase : isUpperCase }}
    </p-card>
  </div>
  <div class="col-12 md:col-12">
    <p-card header="Menu">
      <p-toolbar>
        <div class="p-toolbar-group-start">
          <p-button
            (onClick)="toggleIsUpperCase()"
            label="ToggleCase"
            icon="pi pi-plus"
            class="mr-2"
          />
          <p-button
            (onClick)="onSortByPropertyChange('name')"
            label="Por nombre"
            icon="pi pi-sort"
            class="mr-2"
          />
          <p-button
            (onClick)="onSortByPropertyChange('category')"
            label="Por categoria"
            icon="pi pi-sort"
            class="mr-2"
          />
          <p-button
            (onClick)="onSortByPropertyChange('quantity')"
            label="Por cantidad"
            icon="pi pi-sort"
          />
        </div>
      </p-toolbar>

      <p-panel header="Productos" class="mt-2 block">
        <p-table
          [value]="products | sortBy : sortByProperty"
          [tableStyle]="{ 'min-width': '50rem' }"
        >
          <ng-template pTemplate="header">
            <tr>
              <th>Code</th>
              <th>Name</th>
              <th>Category</th>
              <th>Quantity</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-product>
            <tr>
              <td>{{ product.code }}</td>
              <td>{{ product.name }}</td>
              <td>{{ product.category | i18nSelect : categoryMap }}</td>
              <td>{{ product.quantity }}</td>
            </tr>
          </ng-template>
        </p-table>
      </p-panel>
    </p-card>
  </div>
</div>
