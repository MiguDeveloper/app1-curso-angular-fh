<p-sidebar [(visible)]="sidebarVisible" position="right">
  <div class="flex flex-column mx-auto md:mx-0">
    <span class="mb-2 font-semibold">Bienvenido</span>
    <span class="text-color-secondary font-medium mb-5">{{
      userLogged()?.name
    }}</span>
    <ul class="list-none m-0 p-0">
      <li>
        <a
          class="text-sm cursor-pointer flex surface-border mb-3 p-3 align-items-center border-1 surface-border border-round hover:surface-hover transition-colors transition-duration-150"
          ><span><i class="pi pi-user text-xl text-primary"></i></span>
          <div class="ml-3">
            <span class="mb-2 font-semibold">Profile</span>
            <p class="text-color-secondary m-0">Lorem ipsum date visale</p>
          </div></a
        >
      </li>
      <li>
        <a
          class="text-sm cursor-pointer flex surface-border mb-3 p-3 align-items-center border-1 surface-border border-round hover:surface-hover transition-colors transition-duration-150"
          ><span><i class="pi pi-cog text-xl text-primary"></i></span>
          <div class="ml-3">
            <span class="mb-2 font-semibold">Settings</span>
            <p class="text-color-secondary m-0">Exercitation veniam</p>
          </div></a
        >
      </li>
      <li>
        <a
          (click)="onLogout()"
          class="text-sm cursor-pointer flex surface-border mb-3 p-3 align-items-center border-1 surface-border border-round hover:surface-hover transition-colors transition-duration-150"
          ><span><i class="pi pi-power-off text-xl text-primary"></i></span>
          <div class="ml-3">
            <span class="mb-2 font-semibold">Sign Out</span>
            <p class="text-color-secondary m-0">Sed ut perspiciatis</p>
          </div></a
        >
      </li>
    </ul>
  </div>
</p-sidebar>

<p-button (onClick)="showSidebar()" [link]="true" class="p-link"
  ><img
    src="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
    class="p-avatar-navbar"
/></p-button>
